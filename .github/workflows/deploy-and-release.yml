name: Deploy PWA & Release APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages-and-release"
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------
  # 0) نجهّز مفتاح التوقيع أولاً (قبل أي نشر) ونحسب بصمة SHA256 الحقيقية
  #    الخاصة به، ثم نمررها للخطوات التالية. هذا يحل المشكلة الجذرية اللي
  #    كانت بتخلي التطبيق يفتح بشكل متصفح كروم عادي (بشريط عنوان) بدل ما
  #    يفتح كتطبيق مستقل: قديماً كان ملف assetlinks.json فيه بصمة ثابتة
  #    مكتوبة يدوياً، وإذا لم يكن هناك مفتاح توقيع ثابت محفوظ في Secrets،
  #    كان كل تشغيل يولّد مفتاح توقيع جديد عشوائي، فتختلف بصمته عن اللي
  #    في assetlinks.json، فيفشل التحقق (Digital Asset Links) ويسقط
  #    التطبيق تلقائياً لوضع متصفح Chrome العادي (Custom Tab بشريط عنوان).
  #    الحل: نولّد/نحمّل المفتاح مرة واحدة هنا، ونكتب بصمته فعلياً في
  #    assetlinks.json قبل النشر، فيتطابقا دائماً مهما حصل.
  # ---------------------------------------------------------------------
  prepare-signing:
    runs-on: ubuntu-latest
    outputs:
      fingerprint: ${{ steps.signing.outputs.fingerprint }}
      key_alias: ${{ steps.signing.outputs.key_alias }}
    steps:
      - uses: actions/checkout@v4

      - name: تجهيز بيئة الجافا
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: تجهيز أو توليد مفتاح التوقيع وحساب بصمته
        id: signing
        run: |
          ALIAS="androidkey"
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "تم العثور على مفتاح توقيع ثابت في Secrets - سيُستخدم."
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android.keystore
            STOREPASS="${{ secrets.ANDROID_KEYSTORE_PASSWORD }}"
            KEYPASS="${{ secrets.ANDROID_KEY_PASSWORD }}"
            ALIAS="${{ secrets.ANDROID_KEY_ALIAS }}"
            if [ -z "$ALIAS" ]; then ALIAS="androidkey"; fi
          else
            echo "لا يوجد مفتاح توقيع ثابت - سيتم توليد مفتاح لهذا التشغيل فقط."
            STOREPASS="auto-generated-build"
            KEYPASS="auto-generated-build"
            keytool -genkeypair -v -keystore android.keystore -alias "$ALIAS" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$STOREPASS" -keypass "$KEYPASS" \
              -dname "CN=AST-2012A, OU=Auto, O=Auto, L=NA, S=NA, C=US"
          fi

          echo "::add-mask::$STOREPASS"
          echo "::add-mask::$KEYPASS"

          FINGERPRINT=$(keytool -list -v -keystore android.keystore -alias "$ALIAS" -storepass "$STOREPASS" \
            | grep "SHA256:" | sed 's/.*SHA256: //')
          echo "بصمة SHA256 الفعلية لهذا التشغيل: $FINGERPRINT"

          {
            echo "storepass=$STOREPASS"
            echo "keypass=$KEYPASS"
          } >> "$GITHUB_OUTPUT"
          echo "fingerprint=$FINGERPRINT" >> "$GITHUB_OUTPUT"
          echo "key_alias=$ALIAS" >> "$GITHUB_OUTPUT"

      - name: رفع مفتاح التوقيع كملف مؤقت لمشاركته مع مرحلة البناء
        uses: actions/upload-artifact@v4
        with:
          name: android-keystore
          path: android.keystore
          retention-days: 1

  # ---------------------------------------------------------------------
  # 1) ننشر ملفات الـ PWA على GitHub Pages، بعد كتابة بصمة مفتاح التوقيع
  #    الحقيقية داخل .well-known/assetlinks.json حتى يظهر التطبيق كتطبيق
  #    مستقل بدون شريط عنوان المتصفح من أول تشغيل.
  # ---------------------------------------------------------------------
  deploy-pages:
    needs: prepare-signing
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: كتابة بصمة SHA256 الحقيقية في assetlinks.json
        run: |
          mkdir -p .well-known
          cat > .well-known/assetlinks.json << EOF
          [
            {
              "relation": ["delegate_permission/common.handle_all_urls"],
              "target": {
                "namespace": "android_app",
                "package_name": "com.ast2012a.clinicalmaster",
                "sha256_cert_fingerprints": ["${{ needs.prepare-signing.outputs.fingerprint }}"]
              }
            }
          ]
          EOF
          cat .well-known/assetlinks.json

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - id: deployment
        uses: actions/deploy-pages@v4

  # ---------------------------------------------------------------------
  # 2) نبني APK موقّع باستخدام Bubblewrap (Trusted Web Activity) بنفس
  #    مفتاح التوقيع اللي حسبنا بصمته فوق بالضبط، فيتطابق مع assetlinks.json
  #    المنشور ويُتحقق منه بنجاح = تطبيق مستقل حقيقي، مش متصفح Chrome.
  # ---------------------------------------------------------------------
  build-apk:
    needs: [ prepare-signing, deploy-pages ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: تحميل مفتاح التوقيع المُجهّز مسبقاً
        uses: actions/download-artifact@v4
        with:
          name: android-keystore
          path: .

      - name: تجهيز بيئة الجافا
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: تجهيز Android SDK
        uses: android-actions/setup-android@v3

      - name: تثبيت حزم Android SDK المطلوبة لبناء التطبيق
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-33" "build-tools;33.0.2"

      - name: تجهيز Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: تثبيت Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: إعداد Bubblewrap مسبقًا (JDK + Android SDK) لتفادي أي سؤال تفاعلي
        run: |
          mkdir -p "$HOME/.bubblewrap"
          cat > "$HOME/.bubblewrap/config.json" << EOF
          {
            "jdkPath": "${JAVA_HOME}",
            "androidSdkPath": "${ANDROID_HOME}"
          }
          EOF
          cat "$HOME/.bubblewrap/config.json"

      - name: تحديد رابط الاستضافة (GitHub Pages)
        id: pages_url
        run: |
          OWNER="${{ github.repository_owner }}"
          REPO="${{ github.event.repository.name }}"
          LOWER_OWNER=$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')
          if [ "$(echo "$REPO" | tr '[:upper:]' '[:lower:]')" = "${LOWER_OWNER}.github.io" ]; then
            BASE_URL="https://${LOWER_OWNER}.github.io/"
            START_PATH="/"
          else
            BASE_URL="https://${LOWER_OWNER}.github.io/${REPO}/"
            START_PATH="/${REPO}/"
          fi
          HOST="${LOWER_OWNER}.github.io"
          echo "base_url=$BASE_URL" >> "$GITHUB_OUTPUT"
          echo "start_path=$START_PATH" >> "$GITHUB_OUTPUT"
          echo "host=$HOST" >> "$GITHUB_OUTPUT"
          echo "الموقع المتوقع: $BASE_URL"

      - name: توليد twa-manifest.json من القالب
        run: |
          VERSION_CODE=${{ github.run_number }}
          VERSION_NAME="1.0.${{ github.run_number }}"
          sed \
            -e "s#__HOST__#${{ steps.pages_url.outputs.host }}#g" \
            -e "s#__BASE_URL__#${{ steps.pages_url.outputs.base_url }}#g" \
            -e "s#__START_URL__#${{ steps.pages_url.outputs.start_path }}#g" \
            -e "s#__VERSION_NAME__#${VERSION_NAME}#g" \
            -e "s#__VERSION_CODE__#${VERSION_CODE}#g" \
            twa-manifest.template.json > twa-manifest.json
          cat twa-manifest.json

      - name: انتظار جاهزية الموقع المنشور (والتأكد من تطابق assetlinks.json)
        run: |
          URL="${{ steps.pages_url.outputs.base_url }}manifest.json"
          echo "التحقق من: $URL"
          for i in $(seq 1 15); do
            if curl -sSf "$URL" > /dev/null; then
              echo "الموقع جاهز."
              break
            fi
            echo "محاولة $i: لسه مش جاهز، بننتظر 10 ثواني..."
            sleep 10
            if [ "$i" = "15" ]; then
              echo "::error::تعذر الوصول لموقع GitHub Pages بعد عدة محاولات."
              exit 1
            fi
          done

          LIVE_FP=$(curl -sSf "${{ steps.pages_url.outputs.base_url }}.well-known/assetlinks.json" | grep -o '"[0-9A-F:]\{95\}"' | tr -d '"')
          echo "بصمة assetlinks.json المنشورة: $LIVE_FP"
          echo "بصمة مفتاح التوقيع المُستخدم الآن: ${{ needs.prepare-signing.outputs.fingerprint }}"
          if [ "$LIVE_FP" != "${{ needs.prepare-signing.outputs.fingerprint }}" ]; then
            echo "::warning::بصمة assetlinks.json المنشورة لا تطابق مفتاح التوقيع (قد يكون الكاش لسه قديم) - التطبيق قد يفتح كمتصفح مؤقتاً حتى يتحدّث."
          fi

      - name: توليد مشروع الأندرويد مسبقًا (عشان رسالة الـ checksum متظهرش خالص)
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ needs.prepare-signing.outputs.storepass }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ needs.prepare-signing.outputs.keypass }}
        run: bubblewrap update --skipVersionUpgrade

      - name: بناء التطبيق (APK)
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ needs.prepare-signing.outputs.storepass }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ needs.prepare-signing.outputs.keypass }}
        run: |
          bubblewrap build --skipPwaValidation
          ls -la

      - name: تجهيز ملف الإصدار النهائي
        run: |
          mkdir -p dist
          if [ -f app-release-signed.apk ]; then
            cp app-release-signed.apk "dist/AST-2012A-v1.0.${{ github.run_number }}.apk"
          else
            echo "::error::لم يتم العثور على ملف APK الناتج."
            find . -maxdepth 2 -iname "*.apk"
            exit 1
          fi

      - name: إنشاء إصدار (Release) تلقائي على GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: AST-2012A v1.0.${{ github.run_number }}
          body: |
            تحديث تلقائي مبني من آخر كود على main.
            نزّل ملف الـ APK تحت وثبّته على جهاز أندرويد (فعّل "السماح بمصادر غير معروفة" عند التثبيت أول مرة).

            بصمة مفتاح التوقيع المستخدم في هذا الإصدار: `${{ needs.prepare-signing.outputs.fingerprint }}`

            ⚠️ إذا كان عندك إصدار سابق مثبّت ولم يتم إعداد مفتاح توقيع ثابت (راجع README-APK.md)،
            قد تحتاج لإزالة النسخة القديمة أولاً قبل تثبيت هذا الإصدار.
          files: dist/*.apk
          make_latest: true
